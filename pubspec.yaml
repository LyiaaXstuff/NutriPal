name: nutripal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera access for NutriPal nutrition label scanner
  camera: ^0.12.1

  # Select nutrition label images from user's gallery
  image_picker: ^1.2.4
  google_mlkit_text_recognition: 0.17.1
  image: ^4.12.0

  # AI reading of hard labels through the
  # extractNutritionLabel Cloud Function (functions/)
  firebase_core: ^5.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  google_mlkit_barcode_scanning: ^0.16.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/