name: nutripal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera access for NutriPal nutrition label scanner
  camera: ^0.12.1

  # Select nutrition label images from user's gallery
  image_picker: ^1.2.4
  google_mlkit_text_recognition: 0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/